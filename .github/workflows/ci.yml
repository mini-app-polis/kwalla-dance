name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over full
  # history, `npm audit` against the resolved dependency set, and semgrep.
  # sbom: false because SEC-005 does not apply to a static site.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: typescript
      package-manager: npm
      sbom: false

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # A floating "22" takes the runner's cached 22.x, which can be
          # older than the minimum the site's Astro version requires.
          check-latest: true

      - name: Install dependencies
        run: npm ci

      # Deliberately no `env:` block. An unset repository variable
      # interpolates to the empty string, not to nothing, and the site
      # reads these with `??` — which falls back on null/undefined but
      # not on "". Passing `${{ vars.PUBLIC_SITE_URL }}` when the
      # variable does not exist therefore replaced a working default
      # with "", and `new URL(path, "")` failed the whole build.
      #
      # This job proves the site compiles; Cloudflare Pages supplies the
      # real values at deploy time. Leaving them unset here is what lets
      # the in-code defaults apply.
      - name: Build
        run: npm run build

  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3

  # Conformance is graded when the repository changes, and this is where
  # that is said. The evaluation runs after this job ends, so what the job
  # reports is whether the request landed — never what was found.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
