# Manual rebuild.
#
# Calendar changes no longer need a rebuild — they arrive live through
# /api/calendar — but the copy baked into the HTML at build time is the
# fallback a no-JS visitor or a crawler sees. Running this by hand
# (Actions → Scheduled rebuild → Run workflow) pings a Cloudflare Pages
# deploy hook to refresh that copy. It used to run on a schedule; the cron
# trigger has since been removed, so it runs only when started.
#
# Inert until the CLOUDFLARE_DEPLOY_HOOK secret exists — the step is guarded,
# so a fork or a fresh clone will not produce failing red runs.

name: Scheduled rebuild

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK not set — skipping. See TODO.md §5."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Deploy triggered."
