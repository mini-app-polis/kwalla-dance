# Scheduled rebuild.
#
# The "Where I'll be" list is baked in at build time, so a new event on
# Kristen's phone does not appear on the site until something triggers a
# build. This pings a Cloudflare Pages deploy hook twice a day to close that
# gap without her needing to do anything.
#
# Inert until the CLOUDFLARE_DEPLOY_HOOK secret exists — the step is guarded,
# so a fork or a fresh clone will not produce failing red runs.
#
# Twice daily is deliberate. iCloud's public feeds are cached hard on Apple's
# side, so polling more often mostly re-serves the same stale copy.

name: Scheduled rebuild

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK not set — skipping. See TODO.md §5."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Deploy triggered."
