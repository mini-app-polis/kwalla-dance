version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Without an explicit prefix Dependabot's default subject ("Bump x from y to
    # z") is not a Conventional Commit, which leaves this repo's history
    # inconsistent with the rest of the ecosystem and unreadable to any release
    # tooling added later.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      js-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
