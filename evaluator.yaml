# kwalla-dance / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: static-site

traits:
  - cloudflare-pages
  # Deployed via Cloudflare Pages Git integration (auto-deploy on push to main).
  # The trait records how the site ships; it exempts no rules. ci.yml builds
  # and scans the site before it reaches Cloudflare.

exemptions:
  - rule: CD-002
    reason: "Static Astro site with no server-side runtime. Client-side Sentry (@sentry/astro) is also not required — no auth, user sessions, or error surfaces that warrant browser error tracking at this stage. Full CD-002 exception covers both server-side and client-side Sentry."

# TEST-001/002/003/004 covered by static-site type scoping.
# XSTACK-001 covered by static-site type scoping (no server-side logic).
# XSTACK-003 (pnpm) covered by static-site type scoping (npm permitted for static sites).
# CD-009/010 covered by static-site type scoping (no server runtime).
